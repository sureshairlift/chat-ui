    <aside [class]="asideClass">
      <!-- Search box + New chat button -->
      <div class="p-3 space-y-2">
        <button (click)="state.openSearch()"
          class="w-full flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500 text-[13px] transition">
          <app-icon name="search" [size]="14"></app-icon>
          <span class="flex-1 text-left">Search</span>
          <kbd
            class="hidden md:inline-flex text-[10px] px-1.5 py-0.5 bg-gray-100 rounded border border-gray-200 text-gray-500">⌘K</kbd>
        </button>
        <button (click)="state.setView('home')"
          class="flex items-center gap-3 bg-blue-50 hover:bg-blue-100 transition rounded-2xl px-4 py-2.5 text-blue-900 shadow-sm w-full">
          <app-icon name="message-square" [size]="18"></app-icon>
          <span class="text-[14px] font-medium">New chat</span>
        </button>
      </div>

      <!-- Body — scrollable -->
      <div class="flex-1 overflow-y-auto px-2 pb-4 scrollable">
        <!-- Shortcuts group toggle -->
        <button (click)="shortcutsOpen.set(!shortcutsOpen())"
          class="group flex w-full items-center gap-1 px-3 py-1.5 text-[13px] text-gray-700 hover:bg-gray-100 rounded-md mt-1">
          <app-icon [name]="shortcutsOpen() ? 'chevron-down' : 'chevron-right'" [size]="14" class="text-gray-500">
          </app-icon>
          <span class="flex-1 text-left font-medium">Shortcuts</span>
        </button>

        <div *ngIf="shortcutsOpen()" class="space-y-0.5 mb-2">
          <app-sidebar-item label="Dashboard" [active]="state.view() === 'dashboard'"
            (clicked)="state.setView('dashboard')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
          </app-sidebar-item>

          <app-sidebar-item label="Home" [active]="state.view() === 'home' && state.selectedSection() === 'all'"
            (clicked)="state.setView('home')">
            <app-icon name="home" [size]="18"></app-icon>
          </app-sidebar-item>

          <app-sidebar-item label="Mentions" [active]="state.view() === 'mentions'"
            (clicked)="state.setView('mentions')">
            <app-icon name="at-sign" [size]="18"></app-icon>
          </app-sidebar-item>

          <app-sidebar-item label="Threads" [active]="state.view() === 'threads'" (clicked)="state.setView('threads')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              <line x1="8" y1="9" x2="16" y2="9" />
              <line x1="8" y1="13" x2="13" y2="13" />
            </svg>
          </app-sidebar-item>

          <app-sidebar-item label="Unread" [active]="state.view() === 'home' && state.selectedSection() === 'unread'"
            (clicked)="state.setSection('unread')" [count]="unreadCount()">
            <app-icon name="inbox" [size]="18"></app-icon>
          </app-sidebar-item>

          <app-sidebar-item label="Pinned chats"
            [active]="state.view() === 'home' && state.selectedSection() === 'pinned'"
            (clicked)="state.setSection('pinned')" [count]="pinnedCount()">
            <app-icon name="pin" [size]="18"></app-icon>
          </app-sidebar-item>

          <app-sidebar-item label="Saved messages" [active]="state.view() === 'starred'"
            (clicked)="state.setView('starred')">
            <app-icon name="bookmark" [size]="18"></app-icon>
          </app-sidebar-item>

          <app-sidebar-item label="Sent" [active]="state.view() === 'sent'" (clicked)="state.setView('sent')">
            <app-icon name="send" [size]="18"></app-icon>
          </app-sidebar-item>
        </div>

        <!-- Divider -->
        <div class="mx-3 my-2 border-t border-gray-200"></div>

        <!-- ============== Reorderable section list ==============
             Built-ins and custom sections render through a single *ngFor
             over `orderedSections()`. Press and drag *anywhere* on a row
             (mouse or touch) to reorder. A small grip indicator appears
             on hover (desktop) as a hint that the row is draggable. Order
             persists to localStorage. -->
        <ng-container *ngFor="let row of orderedSections(); let i = index; trackBy: trackBySection">
          <div #sectionRowEl
               (pointerdown)="onRowPointerDown(i, $event)"
               (dragover)="onConvDragOver($event, row.id)"
               (dragleave)="onConvDragLeave($event, row.id)"
               (drop)="onConvDrop($event, row.id)"
               [class]="'group/sec relative rounded-md transition ' + rowDragClass(i, row.id)"
               style="touch-action: none;">
            <!-- Inline warning pill shown while a drag is hovering a
                 section whose type rules reject this conv. Tells the
                 user WHY the drop cursor flipped to no-entry. -->
            <div *ngIf="invalidDropTargetId() === row.id"
                 class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-0.5 bg-white text-red-600 text-[11px] rounded ring-1 ring-red-200 shadow-sm pointer-events-none flex items-center gap-1">
              <app-icon name="x" [size]="10"></app-icon>
              Can't move here
            </div>

            <!-- Hover grip indicator — purely decorative, hints the row is
                 draggable. Sits on the left edge, fades in on hover. The
                 element is pointer-events-none so it never steals clicks
                 from the row underneath. -->
            <span class="hidden md:flex absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1.5 w-3 h-6 items-center justify-center text-gray-400 opacity-0 group-hover/sec:opacity-100 pointer-events-none transition"
                  aria-hidden="true">
              <svg width="8" height="14" viewBox="0 0 10 14" fill="currentColor">
                <circle cx="2" cy="2" r="1.2"/><circle cx="8" cy="2" r="1.2"/>
                <circle cx="2" cy="7" r="1.2"/><circle cx="8" cy="7" r="1.2"/>
                <circle cx="2" cy="12" r="1.2"/><circle cx="8" cy="12" r="1.2"/>
              </svg>
            </span>

            <!-- Customer Conversations (special amber styling) -->
            <button *ngIf="row.kind === 'customers'"
                    (click)="state.setSection('customers')"
                    [class]="customersBtnClass()">
              <span class="shrink-0 w-6 h-6 flex items-center justify-center rounded-md bg-gradient-to-br from-amber-400 to-orange-500 shadow-sm">
                <app-icon name="globe" [size]="12" class="text-white"></app-icon>
              </span>
              <span class="flex-1 text-left truncate">{{ row.label }}</span>
              <span *ngIf="row.count > 0" [class]="customersBadgeClass()">{{ row.count }}</span>
              <app-icon name="chevron-right" [size]="14"
                [class]="state.selectedSection() === 'customers' ? 'text-amber-700' : 'text-gray-400'">
              </app-icon>
            </button>

            <!-- Airlift Intelligence (gradient) -->
            <button *ngIf="row.kind === 'ai'"
                    (click)="state.setSection('ai')"
                    [class]="aiBtnClass()">
              <span class="shrink-0 w-6 h-6 flex items-center justify-center rounded-md bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500">
                <app-icon name="sparkles" [size]="12" class="text-white"></app-icon>
              </span>
              <span class="flex-1 text-left truncate">{{ row.label }}</span>
              <span *ngIf="row.count > 0" [class]="aiBadgeClass()">{{ row.count }}</span>
              <app-icon name="chevron-right" [size]="14"
                [class]="state.selectedSection() === 'ai' ? 'text-purple-700' : 'text-gray-400'">
              </app-icon>
            </button>

            <!-- Built-in: Direct / Test / Spaces -->
            <app-section-header
              *ngIf="row.kind === 'direct' || row.kind === 'spaces'"
              [label]="row.label" [count]="row.count"
              [active]="state.selectedSection() === row.id"
              (clicked)="state.setSection(row.id)">
              <app-icon *ngIf="row.kind === 'direct'" name="message-square" [size]="18"></app-icon>
              <app-icon *ngIf="row.kind === 'spaces'" name="users"          [size]="18"></app-icon>
            </app-section-header>

            <!-- Custom sections.
                 DOM layout note: the header + action pill share their
                 own `group relative` so the pill is centered on the
                 header alone. The edit popover is a SIBLING below — if
                 it lived inside the same wrapper, opening it would
                 grow the wrapper's height and top-1/2 would push the
                 pill down into the popover region. -->
            <ng-container *ngIf="row.kind === 'custom'">
              <div class="group relative">
                <app-section-header
                  [label]="row.label" [count]="row.count"
                  [active]="state.selectedSection() === row.id"
                  (clicked)="state.setSection(row.id)">
                  <!-- Emoji takes priority; falls back to colored #
                       chip for sections that pre-date the picker.
                       PNG at rest, animated WebP on row hover via
                       the outer group/sec scope. -->
                  <ng-container *ngIf="row.custom?.emoji as e; else hashChip">
                    <img [src]="e | notoEmoji:'png':72" [alt]="e"
                         class="w-5 h-5 object-contain group-hover/sec:hidden" />
                    <img [src]="e | notoEmoji:'webp':72" [alt]="e"
                         (error)="notoWebpFallback($event)"
                         class="w-5 h-5 object-contain hidden group-hover/sec:block" />
                  </ng-container>
                  <ng-template #hashChip>
                    <span [class]="'w-5 h-5 rounded-md flex items-center justify-center ' + (row.custom?.color || 'bg-gray-400')">
                      <app-icon name="hash" [size]="12" class="text-white"></app-icon>
                    </span>
                  </ng-template>
                </app-section-header>
                <!-- Action pill — white bg + shadow so it masks the
                     section-header's trailing count + chevron on
                     hover. Hidden entirely while editing (popover
                     already exposes Save/Cancel + the same fields). -->
                <div *ngIf="editingSectionId() !== row.id"
                     class="absolute right-2 top-1/2 -translate-y-1/2 hidden group-hover:flex items-center gap-px px-0.5 py-0.5 bg-white rounded-md shadow-sm ring-1 ring-gray-200">
                  <button (click)="$event.stopPropagation(); startEditSection(row)"
                          class="p-1 rounded hover:bg-gray-100 text-gray-500 hover:text-gray-800"
                          title="Edit section">
                    <app-icon name="pencil" [size]="12"></app-icon>
                  </button>
                  <button (click)="$event.stopPropagation(); onDeleteSection(row.id, row.label)"
                          class="p-1 rounded hover:bg-red-50 text-gray-500 hover:text-red-600"
                          title="Delete section">
                    <app-icon name="trash-2" [size]="12"></app-icon>
                  </button>
                </div>
              </div>

              <!-- Inline edit popover (sibling of the header wrapper,
                   not inside it — see DOM note above). -->
              <div *ngIf="editingSectionId() === row.id"
                   (click)="$event.stopPropagation()"
                   class="mt-1 mb-2 mx-3 p-3 rounded-lg border border-gray-200 bg-white shadow-sm space-y-2">
                <input [ngModel]="editingLabel()" (ngModelChange)="editingLabel.set($event)"
                       (keydown.enter)="saveEdit()" (keydown.escape)="cancelEdit()"
                       placeholder="Section name"
                       class="w-full text-[13px] bg-transparent outline-none border-b border-gray-300 focus:border-blue-500 pb-0.5"/>
                <div class="relative">
                  <app-icon name="search" [size]="12" class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400"></app-icon>
                  <input [ngModel]="editSearch()" (ngModelChange)="editSearch.set($event)"
                         placeholder="Search emojis"
                         class="w-full text-[12px] bg-gray-50 rounded pl-7 pr-2 py-1 border border-gray-200 focus:border-blue-400 outline-none"/>
                </div>
                <div class="grid grid-cols-6 gap-1.5 max-h-48 overflow-y-auto scrollable pr-1">
                  <button *ngFor="let e of filteredEditEmojis()"
                          type="button" (click)="toggleEditEmoji(e.c)"
                          [title]="e.k"
                          [class]="'group/em aspect-square w-full rounded flex items-center justify-center transition ' +
                                   (editingEmoji() === e.c ? 'bg-blue-100 ring-1 ring-inset ring-blue-400' : 'hover:bg-gray-100')">
                    <img [src]="e.c | notoEmoji:'png':72" [alt]="e.c"
                         class="w-5 h-5 object-contain group-hover/em:hidden" />
                    <img [src]="e.c | notoEmoji:'webp':512" [alt]="e.c"
                         (error)="notoWebpFallback($event)"
                         class="w-5 h-5 object-contain hidden group-hover/em:block" />
                  </button>
                  <div *ngIf="filteredEditEmojis().length === 0"
                       class="col-span-6 py-2 text-center text-[11px] text-gray-500 italic">
                    No matches
                  </div>
                </div>
                <div class="flex items-center justify-end gap-1.5 pt-1">
                  <button (click)="cancelEdit()"
                          class="text-[12px] px-2 py-1 rounded text-gray-600 hover:bg-gray-100">
                    Cancel
                  </button>
                  <button (click)="saveEdit()"
                          class="text-[12px] px-2 py-1 rounded bg-blue-600 text-white hover:bg-blue-700">
                    Save
                  </button>
                </div>
              </div>
            </ng-container>
          </div>
        </ng-container>

        <!-- New section creator. Name input on top, then a scrollable
             Noto-emoji grid below. Tap an emoji to select / tap again
             to clear (falls back to the colored # chip). Enter
             confirms, Esc cancels. Each grid cell renders the static
             PNG at rest and swaps to the animated WebP on hover. -->
        <div *ngIf="addingSection(); else addBtn" class="px-3 pt-1 pb-2 mt-1 space-y-2">
          <div class="flex items-center gap-2">
            <img *ngIf="newSectionEmoji() as e"
                 [src]="e | notoEmoji:'png':72" [alt]="e"
                 class="w-5 h-5 shrink-0 object-contain" />
            <app-icon *ngIf="!newSectionEmoji()" name="plus" [size]="14" class="text-gray-500 shrink-0"></app-icon>
            <input #sectionInput [ngModel]="newSectionName()" (ngModelChange)="newSectionName.set($event)"
              (keydown.enter)="confirmAddSection()" (keydown.escape)="cancelAddSection()" placeholder="Section name..."
              class="flex-1 text-[13px] bg-transparent outline-none border-b border-gray-300 focus:border-blue-500 pb-0.5"
              autofocus />
            <button (click)="cancelAddSection()" class="text-gray-400 hover:text-gray-600">
              <app-icon name="x" [size]="14"></app-icon>
            </button>
          </div>
          <!-- Search box. Filters the curated emoji list by keyword
               (e.g., "love", "dev", "happy"). Blank query shows all. -->
          <div class="relative">
            <app-icon name="search" [size]="12" class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400"></app-icon>
            <input [ngModel]="createSearch()" (ngModelChange)="createSearch.set($event)"
                   placeholder="Search emojis"
                   class="w-full text-[12px] bg-gray-50 rounded pl-7 pr-2 py-1 border border-gray-200 focus:border-blue-400 outline-none"/>
          </div>
          <div class="grid grid-cols-6 gap-1.5 max-h-48 overflow-y-auto scrollable pr-1">
            <button *ngFor="let e of filteredCreateEmojis()"
                    type="button" (click)="toggleEmojiPick(e.c)"
                    [title]="e.k"
                    [class]="'group/em aspect-square w-full rounded flex items-center justify-center transition ' +
                             (newSectionEmoji() === e.c ? 'bg-blue-100 ring-1 ring-inset ring-blue-400' : 'hover:bg-gray-100')">
              <img [src]="e.c | notoEmoji:'png':72" [alt]="e.c"
                   class="w-5 h-5 object-contain group-hover/em:hidden" />
              <img [src]="e.c | notoEmoji:'webp':512" [alt]="e.c"
                   (error)="notoWebpFallback($event)"
                   class="w-5 h-5 object-contain hidden group-hover/em:block" />
            </button>
            <div *ngIf="filteredCreateEmojis().length === 0"
                 class="col-span-6 py-2 text-center text-[11px] text-gray-500 italic">
              No matches
            </div>
          </div>
        </div>
        <ng-template #addBtn>
          <button (click)="addingSection.set(true)"
            class="group flex w-full items-center gap-3 px-3 py-1.5 rounded-md text-[13px] text-gray-500 hover:text-gray-800 hover:bg-gray-50 mt-1 transition">
            <app-icon name="plus" [size]="14" class="shrink-0"></app-icon>
            <span class="flex-1 text-left">New section</span>
          </button>
        </ng-template>
      </div>

      <!-- Footer: status pill + collapse button -->
      <div class="border-t border-gray-100 p-2 space-y-1">
        <!-- Status pill — shows current emoji+text or a "Set status" prompt.
             Click opens the modal editor. -->
        <button (click)="state.openStatusEditor()"
          class="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg hover:bg-gray-100 transition text-left"
          [title]="state.userStatus() ? 'Update status' : 'Set a status'">
          <span
            class="w-7 h-7 shrink-0 flex items-center justify-center text-[16px] rounded-full bg-gray-50 ring-1 ring-gray-200">
            {{ state.userStatus()?.emoji || '😶' }}
          </span>
          <span class="flex-1 min-w-0">
            <span *ngIf="state.userStatus(); else noStatus" class="block text-[13px] text-gray-900 truncate">
              {{ state.userStatus()?.text }}
            </span>
            <ng-template #noStatus>
              <span class="block text-[13px] text-gray-500">Set a status</span>
            </ng-template>
          </span>
        </button>
        <button *ngIf="!bp.isMobile()" (click)="state.sidebarCollapsed.set(true)"
          class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-600 hover:bg-gray-100 transition"
          title="Collapse sidebar">
          <app-icon name="chevron-left" [size]="16"></app-icon>
          <span>Collapse sidebar</span>
        </button>
      </div>
    </aside>
