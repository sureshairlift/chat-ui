    <aside class="w-[60px] h-full shrink-0 flex flex-col bg-white border-r border-gray-200 items-center"
      style="overflow: visible;">
      <div class="flex-1 flex flex-col items-center py-2 gap-1 w-full">
        <!-- Search -->
        <div class="relative group">
          <button (click)="state.openSearch()"
            class="h-9 w-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600">
            <app-icon name="search" [size]="16"></app-icon>
          </button>
          <ng-container *ngTemplateOutlet="tip; context: { label: 'Search', info: '⌘K to open from anywhere' }">
          </ng-container>
        </div>

        <!-- New chat (Plus) -->
        <div class="relative group">
          <button (click)="state.setView('home')"
            class="h-9 w-9 rounded-full bg-blue-50 hover:bg-blue-100 flex items-center justify-center text-blue-700 mb-1">
            <app-icon name="plus" [size]="18"></app-icon>
          </button>
          <ng-container *ngTemplateOutlet="tip; context: { label: 'New chat', info: 'Start a new conversation' }">
          </ng-container>
        </div>

        <div class="w-7 h-px bg-gray-200 my-1"></div>

        <!-- Items -->
        <div *ngFor="let it of items()" class="relative group">
          <button (click)="it.onClick()" [class]="btnClassFor(it)">
            <!-- Custom dashboard icon (4-tile grid) -->
            <svg *ngIf="it.iconCustom === 'dashboard'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
            <!-- Custom threads icon -->
            <svg *ngIf="it.iconCustom === 'threads'" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
              <line x1="8" y1="9" x2="16" y2="9" />
              <line x1="8" y1="13" x2="13" y2="13" />
            </svg>
            <app-icon *ngIf="!it.iconCustom" [name]="it.iconName" [size]="18"></app-icon>
          </button>
          <ng-container *ngTemplateOutlet="tip; context: { label: it.tip, info: it.info }"></ng-container>
        </div>

        <!-- Custom sections divider + entries -->
        <ng-container *ngIf="state.customSections().length > 0">
          <div class="w-7 h-px bg-gray-200 my-1"></div>
          <div *ngFor="let s of state.customSections()" class="relative group">
            <button (click)="state.setSection(s.id)" [class]="'h-9 w-9 rounded-full flex items-center justify-center transition ' +
                (state.selectedSection() === s.id ? 'bg-blue-100' : 'hover:bg-gray-100')">
              <span [class]="'w-6 h-6 rounded-md flex items-center justify-center ' + s.color">
                <app-icon name="hash" [size]="12" class="text-white"></app-icon>
              </span>
            </button>
            <ng-container *ngTemplateOutlet="tip; context: { label: s.label, info: 'Custom section' }"></ng-container>
          </div>
        </ng-container>
      </div>

      <!-- Bottom: status emoji + expand button -->
      <div class="w-full border-t border-gray-100 p-2 flex flex-col items-center gap-1.5">
        <!-- Status emoji button — only the emoji shows in collapsed mode.
             Click opens the editor; tooltip shows the full status text. -->
        <div class="relative group">
          <button (click)="state.openStatusEditor()"
            class="h-9 w-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-[16px]">
            {{ state.userStatus()?.emoji || '😶' }}
          </button>
          <ng-container *ngTemplateOutlet="tip; context: {
            label: state.userStatus()?.text || 'Set a status',
            info: state.userStatus() ? 'Click to update' : ''
          }"></ng-container>
        </div>
        <div class="relative group">
          <button (click)="state.sidebarCollapsed.set(false)"
            class="h-9 w-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600">
            <app-icon name="chevron-right" [size]="18"></app-icon>
          </button>
          <ng-container *ngTemplateOutlet="tip; context: { label: 'Expand sidebar', info: 'Show full labels' }">
          </ng-container>
        </div>
      </div>
    </aside>

    <!-- Tooltip template (right of button) -->
    <ng-template #tip let-label="label" let-info="info">
      <span
        class="absolute left-full ml-3 top-1/2 -translate-y-1/2 z-50 pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap">
        <span class="block bg-gray-900 text-white text-[12px] font-medium rounded-md shadow-lg px-2.5 py-1.5">
          {{ label }}
          <span *ngIf="info" class="block text-[10.5px] font-normal text-gray-300 mt-0.5">{{ info }}</span>
        </span>
      </span>
    </ng-template>
