<aside [class]="asideClass" [style.width.px]="fullscreen ? null : width">
  <!-- Left-edge resize grip — drag to widen/narrow the panel. Emits
       a MouseEvent the parent uses to enter resize mode (mirrors the
       Thread panel's `startResize` API). Hidden in fullscreen mode
       since there's nothing to resize against. -->
  <div *ngIf="!fullscreen && resizable"
       (mousedown)="startResize.emit($event)"
       class="absolute top-0 bottom-0 left-0 w-1 cursor-col-resize hover:bg-blue-300/60 active:bg-blue-400 transition-colors z-20"
       title="Drag to resize"></div>
  <ng-content></ng-content>
</aside>
